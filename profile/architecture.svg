<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BlogCabin 구조: 브라우저 → 서버 관리자 nginx → 우리 nginx → 앱 두 개 → PostgreSQL, 아래는 GitHub Actions 롤링 배포 순서</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a5a3b"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3c7a4e"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="16" fill="#f7efe1"/>

  <!-- 브라우저 -->
  <rect x="30" y="110" width="170" height="120" rx="14" fill="#fffaf0" stroke="#8a5a3b" stroke-width="2"/>
  <text x="115" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#3b2a1e">브라우저</text>
  <text x="115" y="178" text-anchor="middle" font-size="13" fill="#6b5646">PC · 휴대폰</text>
  <text x="115" y="198" text-anchor="middle" font-size="13" fill="#6b5646">광장 게임(Phaser)은</text>
  <text x="115" y="215" text-anchor="middle" font-size="13" fill="#6b5646">브라우저에서 돌아요</text>

  <line x1="200" y1="170" x2="252" y2="170" stroke="#8a5a3b" stroke-width="2" marker-end="url(#a)"/>
  <text x="226" y="160" text-anchor="middle" font-size="12" fill="#6b5646">https</text>

  <!-- 운영 서버 -->
  <rect x="255" y="40" width="700" height="330" rx="16" fill="#fffaf0" stroke="#c9b08f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="275" y="68" font-size="15" font-weight="700" fill="#3b2a1e">운영 서버 (blogcabin.java21.net)</text>

  <rect x="275" y="110" width="150" height="120" rx="12" fill="#ede3d3" stroke="#a89277" stroke-width="1.5"/>
  <text x="350" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a1e">서버 관리자</text>
  <text x="350" y="174" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a1e">nginx</text>
  <text x="350" y="200" text-anchor="middle" font-size="13" fill="#6b5646">:443 → :8440</text>

  <line x1="425" y1="170" x2="477" y2="170" stroke="#8a5a3b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="480" y="110" width="160" height="120" rx="12" fill="#3c7a4e"/>
  <text x="560" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">우리 nginx</text>
  <text x="560" y="176" text-anchor="middle" font-size="13" fill="#e4f1e6">:8440</text>
  <text x="560" y="200" text-anchor="middle" font-size="13" fill="#e4f1e6">두 앱에 번갈아</text>
  <text x="560" y="217" text-anchor="middle" font-size="13" fill="#e4f1e6">손님 나눠 주기</text>

  <line x1="640" y1="150" x2="702" y2="110" stroke="#8a5a3b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="190" x2="702" y2="240" stroke="#8a5a3b" stroke-width="2" marker-end="url(#a)"/>

  <rect x="705" y="75" width="230" height="80" rx="12" fill="#fffaf0" stroke="#3c7a4e" stroke-width="2"/>
  <text x="820" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a1e">앱 1 · :8441</text>
  <text x="820" y="132" text-anchor="middle" font-size="13" fill="#6b5646">Next.js (화면 + 서버 로직)</text>

  <rect x="705" y="200" width="230" height="80" rx="12" fill="#fffaf0" stroke="#3c7a4e" stroke-width="2"/>
  <text x="820" y="233" text-anchor="middle" font-size="16" font-weight="700" fill="#3b2a1e">앱 2 · :8442</text>
  <text x="820" y="257" text-anchor="middle" font-size="13" fill="#6b5646">같은 이미지, 같은 코드</text>

  <rect x="705" y="300" width="230" height="52" rx="10" fill="#f3e6c8" stroke="#c9a85e" stroke-width="1.5"/>
  <text x="820" y="331" text-anchor="middle" font-size="13" fill="#3b2a1e">📎 올린 사진·파일 (서버 디스크)</text>

  <!-- DB -->
  <line x1="935" y1="115" x2="1007" y2="165" stroke="#8a5a3b" stroke-width="2" marker-end="url(#a)"/>
  <line x1="935" y1="240" x2="1007" y2="195" stroke="#8a5a3b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="1010" y="120" width="160" height="110" rx="12" fill="#fffaf0" stroke="#8a5a3b" stroke-width="2"/>
  <text x="1090" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#3b2a1e">PostgreSQL</text>
  <text x="1090" y="184" text-anchor="middle" font-size="13" fill="#6b5646">회원·글·코인 원장</text>
  <text x="1090" y="204" text-anchor="middle" font-size="13" fill="#6b5646">로그인 정보도 여기</text>

  <!-- 배포 -->
  <text x="30" y="430" font-size="16" font-weight="700" fill="#3b2a1e">배포 (main에 합치면 자동)  · GitHub Actions</text>
  <g font-size="13" fill="#3b2a1e">
    <rect x="30" y="450" width="200" height="90" rx="12" fill="#fffaf0" stroke="#3c7a4e" stroke-width="1.5"/>
    <text x="130" y="482" text-anchor="middle" font-weight="700">① Docker 이미지 만들기</text>
    <text x="130" y="506" text-anchor="middle" fill="#6b5646">서버 CPU에 맞춰</text>
    <text x="130" y="524" text-anchor="middle" fill="#6b5646">빌드해 파일로 묶기</text>

    <line x1="230" y1="495" x2="262" y2="495" stroke="#3c7a4e" stroke-width="2" marker-end="url(#g)"/>
    <rect x="265" y="450" width="200" height="90" rx="12" fill="#fffaf0" stroke="#3c7a4e" stroke-width="1.5"/>
    <text x="365" y="482" text-anchor="middle" font-weight="700">② SSH로 서버에 보내기</text>
    <text x="365" y="506" text-anchor="middle" fill="#6b5646">이미지 + 설정 +</text>
    <text x="365" y="524" text-anchor="middle" fill="#6b5646">배포 스크립트</text>

    <line x1="465" y1="495" x2="497" y2="495" stroke="#3c7a4e" stroke-width="2" marker-end="url(#g)"/>
    <rect x="500" y="450" width="200" height="90" rx="12" fill="#fffaf0" stroke="#3c7a4e" stroke-width="1.5"/>
    <text x="600" y="482" text-anchor="middle" font-weight="700">③ DB 준비</text>
    <text x="600" y="506" text-anchor="middle" fill="#6b5646">DB 구조 바꾸기</text>
    <text x="600" y="524" text-anchor="middle" fill="#6b5646">+ 아이템 목록 넣기</text>

    <line x1="700" y1="495" x2="732" y2="495" stroke="#3c7a4e" stroke-width="2" marker-end="url(#g)"/>
    <rect x="735" y="450" width="435" height="90" rx="12" fill="#3c7a4e"/>
    <text x="952" y="482" text-anchor="middle" font-weight="700" fill="#ffffff">④ 롤링 배포: 앱을 하나씩 바꾸기</text>
    <text x="952" y="506" text-anchor="middle" fill="#e4f1e6">앱 1을 빼고 새 버전으로 → 잘 뜨는지 확인 → 다시 넣고 앱 2도 똑같이</text>
    <text x="952" y="524" text-anchor="middle" fill="#e4f1e6">사이트는 끊기지 않고, 실패하면 옛 버전으로 되돌려요</text>
  </g>
  <text x="30" y="590" font-size="13" fill="#6b5646">새 기능은 develop 브랜치에 모았다가, 배포할 때 release/버전 브랜치를 main에 합쳐요 (git flow).</text>
</svg>
